<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WZ Fitness">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" sizes="180x180" href="wz-apple-icon-180.png?v=2">
<link rel="icon" type="image/png" href="wz-icon-192.png">
<link rel="manifest" href="manifest.json?v=2">
<title>WZ Fitness</title>
<style>
:root {
  /* One theme: true black, like Apple Fitness. */
  --bg: #000; --bg2: #1C1C1E; --card: #1C1C1E; --card2: #2C2C2E;
  --fill: rgba(118,118,128,0.24); --fill2: rgba(118,118,128,0.36);
  --label: #FFF; --label2: rgba(235,235,245,0.6); --label3: rgba(235,235,245,0.3);
  --sep: rgba(84,84,88,0.65);
  --blue: #0A84FF; --green: #30D158; --red: #FF453A; --orange: #FF9F0A; --pink: #FF375F;
  --purple: #BF5AF2; --teal: #40C8E0; --cyan: #64D2FF; --indigo: #5E5CE6; --yellow: #FFD60A; --mint: #63E6E2;
  --move: #FA114F; --exercise: #A6FF00; --stand: #00F0FF;
  --material: rgba(18,18,18,0.8); --material-edge: rgba(255,255,255,0.1);
  --scrim: rgba(0,0,0,0.6); --hud: rgba(44,44,46,0.94);
  --shadow: none;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --tab-h: 50px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--label);
  font: 17px/1.29 -apple-system, BlinkMacSystemFont, system-ui, "SF Pro Text", "Helvetica Neue", sans-serif;
  letter-spacing: -0.41px; font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; min-height: 100vh; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; letter-spacing: inherit; touch-action: manipulation; }
input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
a { color: var(--blue); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ── Navigation bar (inline title appears when the large title scrolls away) ── */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  padding-top: var(--safe-t); height: calc(44px + var(--safe-t));
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.navbar::before {
  content: ""; position: absolute; inset: 0; background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 0.5px 0 var(--material-edge); opacity: 0; transition: opacity .2s ease;
}
.navbar-title { position: relative; font-size: 17px; font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity .2s ease, transform .25s ease; }
body.scrolled .navbar::before, body.scrolled .navbar-title { opacity: 1; transform: none; }
body.scrolled .navbar { pointer-events: auto; }

.page { padding: calc(var(--safe-t) + 52px) 0 calc(var(--tab-h) + var(--safe-b) + 32px); max-width: 640px; margin: 0 auto; }
.page.enter { animation: pageIn .28s ease both; }
@keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }

.large-title { padding: 0 20px 8px; display: flex; align-items: flex-end; gap: 12px; }
.large-title .lt-text { flex: 1; min-width: 0; }
.lt-kicker { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: -0.08px; margin-bottom: 2px; }
.lt-title { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px; }
.lt-sub { font-size: 15px; color: var(--label2); letter-spacing: -0.24px; margin-top: 2px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: 0 0 36px; margin-bottom: 4px;
  background: linear-gradient(180deg, #A5A5AD, #85858D); color: #fff;
  display: grid; place-items: center; font-size: 15px; font-weight: 600; letter-spacing: 0;
}

/* ── Sections and grouped lists ── */
.section { margin: 26px 16px 0; }
.section:first-of-type { margin-top: 12px; }
.sec-hdr { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 8px; }
.sec-title { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: 0.35px; }
.sec-link { font-size: 17px; color: var(--blue); }
.sec-cap { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: -0.08px; padding: 0 16px 7px; }
.footnote { font-size: 13px; line-height: 18px; color: var(--label2); letter-spacing: -0.08px; padding: 7px 16px 0; }

.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.card.pad { padding: 16px; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; }
.row {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px;
  padding: 11px 16px; width: 100%; text-align: left;
}
.row + .row::before, .row + .row-wrap::before, .row-wrap + .row::before {
  content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: 0.5px; background: var(--sep);
}
.row.with-icon { --inset: 60px; }
button.row:active, .row.tap:active { background: var(--fill); transition: none; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 17px; line-height: 22px; }
.row-sub { font-size: 13px; line-height: 18px; color: var(--label2); letter-spacing: -0.08px; margin-top: 1px; }
.row-val { font-size: 17px; color: var(--label2); white-space: nowrap; }
.row .chev { color: var(--label3); flex: 0 0 auto; }
.row-btn { color: var(--blue); }
.row-btn.danger { color: var(--red); }
.icon-tile { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: 0 0 32px; font-size: 17px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 50px; padding: 0 20px; border-radius: 14px; font-size: 17px; font-weight: 600;
  background: var(--blue); color: #fff; transition: transform .12s ease, opacity .12s ease;
}
.btn:active { transform: scale(0.97); opacity: .85; transition: none; }
.btn.block { width: 100%; }
.btn.tinted { background: color-mix(in srgb, var(--tint, var(--blue)) 15%, transparent); color: var(--tint, var(--blue)); }
.btn.gray { background: var(--fill); color: var(--label); }
.btn.small { height: 34px; padding: 0 14px; border-radius: 17px; font-size: 15px; }
.btn.capsule { border-radius: 25px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.press { transition: transform .15s ease; }
.press:active { transform: scale(0.97); transition: none; }
.link { color: var(--blue); font-size: 15px; padding: 6px 0; }

/* ── Segmented control ── */
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; position: relative; }
.seg button { flex: 1; height: 28px; border-radius: 7px; font-size: 13px; font-weight: 500; letter-spacing: -0.08px; position: relative; z-index: 1; }
.seg button.on { background: #636366; font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
.seg button.on { background: #636366; }

/* ── Tab bar ── */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding-bottom: var(--safe-b); display: flex; justify-content: center;
  background: var(--material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 -0.5px 0 var(--material-edge);
}
.tabbar-inner { display: flex; width: 100%; max-width: 640px; }
.tab { flex: 1; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--label2); font-size: 10px; font-weight: 500; letter-spacing: 0.1px; }
.tab.on { color: var(--tint, var(--blue)); }
.tab:active svg { transform: scale(0.9); }
.tab svg { transition: transform .15s ease; }

/* ── Hero: today's session ── */
.hero { position: relative; border-radius: 20px; padding: 18px 18px 16px; color: #fff; overflow: hidden; background: var(--hero, #30B0C7); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(0,0,0,0.12)); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero-kicker { font-size: 13px; font-weight: 600; text-transform: uppercase; opacity: .85; letter-spacing: -0.08px; }
.hero-title { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: 0.36px; margin-top: 2px; }
.hero-sub { font-size: 15px; opacity: .9; margin-top: 2px; letter-spacing: -0.24px; }
.hero-actions { display: flex; gap: 10px; margin-top: 16px; }
.hero .btn { background: #fff; color: var(--hero, #30B0C7); }
.hero .btn.ghost { background: rgba(255,255,255,0.22); color: #fff; }
.hero.rest { background: var(--card); color: var(--label); }
.hero.rest::after { display: none; }
.hero.done { --hero: #34C759; }

/* ── Rings ── */
.rings-card { display: flex; align-items: center; gap: 18px; padding: 16px; }
.rings-svg { width: 116px; height: 116px; flex: 0 0 116px; }
.ring-arc { transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.ring-stats { flex: 1; min-width: 0; display: grid; gap: 8px; }
.ring-stat-lbl { font-size: 15px; font-weight: 600; letter-spacing: -0.24px; }
.ring-stat-val { font-size: 20px; font-weight: 600; letter-spacing: 0.38px; line-height: 24px; }
.ring-stat-val small { font-size: 15px; font-weight: 600; opacity: .7; }

/* ── Metric tiles ── */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--card); border-radius: 12px; padding: 12px 14px 14px; text-align: left; min-width: 0; }
.tile-lbl { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 5px; letter-spacing: -0.24px; }
.tile-val { font-size: 28px; font-weight: 700; letter-spacing: 0.36px; line-height: 34px; margin-top: 6px; }
.tile-val small { font-size: 15px; font-weight: 600; color: var(--label2); letter-spacing: -0.24px; }
.tile-sub { font-size: 13px; color: var(--label2); letter-spacing: -0.08px; margin-top: 2px; }
.tile .spark { display: block; width: 100%; height: 34px; margin-top: 8px; }
.trend { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 600; letter-spacing: -0.08px; }

/* ── Week strip ── */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 12px 8px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 2px 0; border-radius: 10px; }
.wd-l { font-size: 11px; font-weight: 600; color: var(--label2); letter-spacing: 0.07px; text-transform: uppercase; }
.wd-dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; position: relative; letter-spacing: 0; }
.wd-dot.planned { box-shadow: inset 0 0 0 2px var(--c); color: var(--c); }
.wd-dot.done { background: var(--c); color: #fff; }
.wd-dot.rest { color: var(--label3); }
.wd.sel .wd-dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; box-shadow: 0 0 0 2px var(--label); }
.wd.today .wd-l { color: var(--red); }
.wd.future { opacity: .45; }
.wd:active .wd-dot { transform: scale(.92); }

/* ── Progress bars ── */
.bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--blue)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.rounds { display: flex; gap: 6px; }
.rounds i { flex: 1; height: 6px; border-radius: 3px; background: var(--fill); transition: background .3s ease; }
.rounds i.on { background: var(--c); }

/* ── Workout list ── */
.move-num { width: 28px; height: 28px; border-radius: 50%; flex: 0 0 28px; display: grid; place-items: center; font-size: 15px; font-weight: 600; background: var(--fill); color: var(--label2); letter-spacing: 0; }
.move-num.done { background: var(--green); color: #fff; }
.row.with-num { --inset: 56px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: color-mix(in srgb, var(--c, var(--blue)) 14%, transparent); color: var(--c, var(--blue)); letter-spacing: 0; }
.stage-dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 2px; }
.stage-dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .25; }
.stage-dots i.on { opacity: 1; }
.checkbtn { width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--label3); color: transparent; transition: background .15s ease, box-shadow .15s ease; }
.checkbtn.on { background: var(--green); box-shadow: none; color: #fff; }
.checkbtn:active { transform: scale(.9); }

.steps-howto { display: grid; gap: 10px; padding: 14px 16px; }
.howto { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 20px; letter-spacing: -0.24px; }
.howto b { flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--fill); color: var(--label2); font-size: 13px; display: grid; place-items: center; letter-spacing: 0; }
.howto.done { color: var(--label2); }
.howto.done b { background: var(--green); color: #fff; }

/* ── Ladder (stage progression) ── */
.ladder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rung { border-radius: 12px; padding: 10px; background: var(--fill); text-align: left; min-width: 0; }
.rung-n { font-size: 12px; font-weight: 600; color: var(--label2); }
.rung-t { font-size: 14px; font-weight: 600; line-height: 18px; margin-top: 2px; letter-spacing: -0.15px; }
.rung.on { background: var(--c); color: #fff; }
.rung.on .rung-n { color: rgba(255,255,255,.8); }
.rung.past { opacity: .6; }

/* ── Sets editor ── */
.sets { display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 24px 1fr 1fr 34px; align-items: center; gap: 8px; }
.set-i { font-size: 15px; color: var(--label2); text-align: center; font-weight: 600; }
.field { height: 40px; border-radius: 10px; background: var(--fill); border: 0; padding: 0 12px; font-size: 17px; width: 100%; outline: none; text-align: center; }
.field:focus { box-shadow: 0 0 0 2px var(--blue); }

/* ── Sheets ── */
.sheet-layer { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; }
.sheet {
  position: relative; width: 100%; max-width: 640px; max-height: calc(100% - var(--safe-t) - 10px);
  background: #1C1C1E; border-radius: 12px 12px 0 0; display: flex; flex-direction: column;
  box-shadow: 0 -10px 40px rgba(0,0,0,.18); will-change: transform; transform: translateY(100%);
}
.sheet.tall { height: calc(100% - var(--safe-t) - 10px); }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 6px auto 0; flex: 0 0 auto; }
.sheet-bar { display: flex; align-items: center; height: 50px; padding: 0 16px; flex: 0 0 auto; touch-action: none; }
.sheet-bar h2 { flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -0.41px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
.sheet-bar .side { flex: 0 0 76px; display: flex; }
.sheet-bar .side.r { justify-content: flex-end; }
.sheet-bar .side button { color: var(--blue); font-size: 17px; height: 44px; }
.sheet-bar .side button.strong { font-weight: 600; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 0 calc(24px + var(--safe-b)); flex: 1 1 auto; }
.sheet-body > .section:first-child { margin-top: 4px; }

/* Action sheet */
.action { position: relative; width: 100%; max-width: 640px; padding: 0 8px calc(8px + var(--safe-b)); transform: translateY(110%); }
.action-group { background: var(--material); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border-radius: 14px; overflow: hidden; }
.action-title { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--label2); letter-spacing: -0.08px; }
.action-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 57px; font-size: 20px; color: var(--blue); letter-spacing: 0.38px; position: relative; }
.action-btn::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 0.5px; background: var(--sep); }
.action-title + .action-btn::before, .action-group > .action-btn:first-child::before { display: none; }
.action-btn.on { font-weight: 600; }
.action-btn.danger { color: var(--red); }
.action-btn:active { background: var(--fill); }
.action-cancel { margin-top: 8px; background: var(--bg2); border-radius: 14px; font-weight: 600; }
.action-cancel::before { display: none; }
.action-dot { width: 10px; height: 10px; border-radius: 50%; }

/* Big number entry */
.bignum { text-align: center; padding: 18px 16px 6px; }
.bignum input { width: 100%; border: 0; background: none; text-align: center; font-size: 64px; font-weight: 700; letter-spacing: -1px; outline: none; font-variant-numeric: tabular-nums; caret-color: var(--blue); }
.bignum .unit { font-size: 17px; color: var(--label2); margin-top: -6px; }
.stepper { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
.stepper button { width: 64px; height: 40px; border-radius: 20px; background: var(--fill); font-size: 17px; font-weight: 600; }
.stepper button:active { background: var(--fill2); }

/* Form rows inside lists */
.frow { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; position: relative; }
.frow + .frow::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; height: 0.5px; background: var(--sep); }
.frow label { flex: 1; font-size: 17px; }
.frow input, .frow select { border: 0; background: none; text-align: right; font-size: 17px; color: var(--label2); outline: none; min-width: 0; width: 45%; padding: 11px 0; }
.frow input:focus { color: var(--blue); }
.frow select { -webkit-appearance: none; appearance: none; width: auto; max-width: 60%; direction: rtl; }
.frow .u { color: var(--label2); font-size: 17px; margin-left: -8px; }
.search { display: flex; align-items: center; gap: 6px; height: 36px; border-radius: 10px; background: var(--fill); padding: 0 8px; color: var(--label2); }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; color: var(--label); min-width: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pick { border-radius: 12px; background: var(--card); padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; }
.pick .e { font-size: 24px; line-height: 28px; }
.pick.on { box-shadow: inset 0 0 0 2px var(--blue); color: var(--blue); }

/* ── Drinks ── */
.drinks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.drink { background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; text-align: left; }
.drink .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 34px; color: #fff; }
.drink .n { font-size: 20px; font-weight: 600; line-height: 22px; letter-spacing: 0.38px; }
.drink .l { font-size: 12px; color: var(--label2); letter-spacing: 0; }
.drink:active { transform: scale(.96); }
.drink.bump .n { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.25); } }

/* ── Chart ── */
.chart { position: relative; padding: 8px 0 0; }
.chart svg { display: block; width: 100%; height: 190px; overflow: visible; touch-action: pan-y; }
.chart .axis { font-size: 11px; fill: var(--label2); letter-spacing: 0; }
.chart-read { display: flex; align-items: baseline; gap: 6px; min-height: 40px; }
.chart-read .v { font-size: 28px; font-weight: 700; letter-spacing: 0.36px; }
.chart-read .u { font-size: 15px; color: var(--label2); font-weight: 600; }
.chart-read .d { font-size: 13px; color: var(--label2); margin-left: auto; }

/* ── Stats grid ── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; }
.stat { padding: 12px 16px; position: relative; }
.stat:nth-child(even)::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 0.5px; background: var(--sep); }
.stat:nth-child(n+3)::after { content: ""; position: absolute; left: 16px; right: 0; top: 0; height: 0.5px; background: var(--sep); }
.stat-l { font-size: 13px; color: var(--label2); letter-spacing: -0.08px; }
.stat-v { font-size: 22px; font-weight: 600; letter-spacing: 0.35px; margin-top: 2px; }
.stat-v small { font-size: 13px; color: var(--label2); font-weight: 500; }
.bmi-scale { position: relative; height: 6px; border-radius: 3px; margin: 12px 0 4px; background: linear-gradient(90deg, var(--cyan) 0 17.5%, var(--green) 17.5% 50%, var(--orange) 50% 75%, var(--red) 75%); }
.bmi-scale i { position: absolute; top: -4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 2.5px var(--label), 0 1px 3px rgba(0,0,0,.3); }

/* ── Awards ── */
.awards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 8px; padding: 16px 8px; }
.award { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; color: var(--label2); letter-spacing: 0; }
.medal { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: var(--fill); filter: grayscale(1); opacity: .45; }
.award.on .medal { filter: none; opacity: 1; background: radial-gradient(circle at 35% 30%, #FFE58A, #FFB800 60%, #E08A00); box-shadow: inset 0 -3px 6px rgba(0,0,0,.18), 0 2px 6px rgba(255,170,0,.35); }
.award.on { color: var(--label); }

/* ── HUD toast ── */
.hud-wrap { position: fixed; left: 0; right: 0; top: calc(var(--safe-t) + 8px); z-index: 300; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.hud {
  pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 420px;
  padding: 12px 16px; border-radius: 22px; background: var(--hud); color: #fff;
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  font-size: 15px; font-weight: 500; letter-spacing: -0.24px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
  transform: translateY(-140%) scale(.9); opacity: 0;
}
.hud button { color: #64D2FF; font-weight: 600; padding: 0 2px; }

/* ── Coach (full-screen session) ── */
.coach {
  position: fixed; inset: 0; z-index: 200; background: #000; color: #fff;
  display: flex; flex-direction: column; padding: calc(var(--safe-t) + 8px) 20px calc(var(--safe-b) + 16px);
  animation: coachIn .35s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes coachIn { from { opacity: 0; transform: scale(1.04); } }
.coach-top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.coach-top button { color: var(--c); font-size: 17px; font-weight: 600; min-width: 60px; height: 44px; }
.coach-top button.r { text-align: right; }
.coach-pct { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 600; }
.coach-prog { height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); overflow: hidden; margin-top: 4px; }
.coach-prog i { display: block; height: 100%; background: var(--c); border-radius: 2px; transition: width .4s ease; }
.coach-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; padding: 12px 0; }
.coach-kicker { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--k); }
.coach-title { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: 0.37px; }
.coach-time { font-size: 68px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -2px; color: var(--k); font-family: ui-rounded, -apple-system, system-ui, sans-serif; }
.coach-reps { font-size: 28px; font-weight: 600; color: var(--k); }
.coach-cue { font-size: 17px; line-height: 24px; color: rgba(255,255,255,.85); max-width: 460px; }
.coach-cue.dim { color: rgba(255,255,255,.55); font-size: 15px; }
.coach-alt { font-size: 14px; color: rgba(255,255,255,.6); background: rgba(255,255,255,.1); padding: 6px 12px; border-radius: 14px; }
.coach-ring { position: relative; width: 240px; height: 240px; display: grid; place-items: center; }
.coach-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.coach-next { font-size: 15px; color: rgba(255,255,255,.6); text-align: center; margin-bottom: 12px; }
.coach-next b { color: #fff; font-weight: 600; }
.coach-btns { display: flex; gap: 10px; }
.coach-btns .btn { height: 56px; border-radius: 28px; font-size: 19px; }
.coach-btns .btn.gray { background: rgba(255,255,255,.16); color: #fff; padding: 0 18px; }

.empty { padding: 28px 20px; text-align: center; color: var(--label2); font-size: 15px; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
ol.steps { padding: 4px 16px 12px 36px; font-size: 15px; line-height: 21px; letter-spacing: -0.24px; }
ol.steps li { margin: 6px 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .navbar::before, .tabbar, .action-group, .hud { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--bg2); }
  .hud { background: #1C1C1E; }
}
@media (prefers-contrast: more) {
  :root { --sep: rgba(235,235,245,0.4); --label2: rgba(235,235,245,0.8); }
  .card, .list, .tile { box-shadow: 0 0 0 1px var(--sep); }
}
/* Inside sheets the surface is #1C1C1E, so grouped rows sit one step lighter (iOS dark style). */
.sheet .card, .sheet .list, .sheet .pick { background: var(--card2); }
.sheet .field, .sheet .search { background: rgba(118,118,128,0.3); }
.hero { box-shadow: 0 10px 30px -12px var(--hero, transparent); }
</style>

function migrateLegacy(s) {
  // Pull values from old keys into new state if they exist.
  try {
    const oldMain = localStorage.getItem('wz-data-' + CURRENT_USER + '-main');
    if (oldMain) {
      const m = JSON.parse(oldMain);
      if (m.daily) for (const [d, v] of Object.entries(m.daily)) {
        s.log[d] = s.log[d] || { food: [], workout: null };
        if (v.steps) s.log[d].steps = Number(v.steps) || 0;
        if (v.cal) s.log[d]._legacyCal = Number(v.cal);
        if (v.protein) s.log[d]._legacyProtein = Number(v.protein);
      }
      if (m.shopChecked) s.shopChecked = { ...s.shopChecked, ...m.shopChecked };
      if (m.workoutLog) for (const [d, w] of Object.entries(m.workoutLog)) {
        s.log[d] = s.log[d] || { food: [] };
        s.log[d].workout = w;
      }
    }
    // Food logs legacy: wz-data-{user}-foodlog-YYYY-MM-DD
    const prefix = 'wz-data-' + CURRENT_USER + '-foodlog-';
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) {
        const d = k.slice(prefix.length);
        try {
          const arr = JSON.parse(localStorage.getItem(k));
          if (Array.isArray(arr) && arr.length) {
            s.log[d] = s.log[d] || { food: [], workout: null };
            if (!s.log[d].food.length) s.log[d].food = arr.map((it, idx) => ({
              id: 'legacy-' + d + '-' + idx,
              n: it.name || it.n || 'Food',
              k: Number(it.cal || it.k || 0),
              p: Number(it.protein || it.p || 0),
              c: Number(it.c || 0),
              f: Number(it.f || 0),
              qty: Number(it.qty || 1),
              s: it.s || '',
              time: it.time || '',
            }));
          }
        } catch {}
      }
    }
    // wmonths = weekly weights
    const wm = localStorage.getItem('wz-data-' + CURRENT_USER + '-wmonths');
    if (wm) {
      try {
        const arr = JSON.parse(wm);
        if (Array.isArray(arr)) s.weekWeights = arr.map(x => ({
          week: Number(x.week), weightKg: Number(x.weight || x.weightKg)
        })).filter(x => x.week && x.weightKg);
      } catch {}
    }
  } catch (e) { console.warn('Migration hiccup:', e); }
  return s;
}

// v5: give every legacy weekly weight a date so blocks/charts can work by date.
function datePastWeights(s) {
  if (!Array.isArray(s.weekWeights)) { s.weekWeights = []; return; }
  let start = s.profile && s.profile.programStart;
  for (const k of Object.keys(s.log || {})) {
    const e = s.log[k];
    const active = e && ((e.food && e.food.length) || e.workout || e.weight || e.steps || e.notes);
    if (active && (!start || k < start)) start = k;
  }
  const base = parseDateKey(start || localDateKey());
  for (const w of s.weekWeights) {
    if (!w.date) w.date = localDateKey(addDays(base, (Number(w.week || 1) - 1) * 7));
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.version === 4) {
        // Back-fill newer profile / sync fields on older saved states
        const d = defaultState();
        s.profile = Object.assign({}, d.profile, s.profile || {});
        s.targets = Object.assign({}, d.targets, s.targets || {});
        if (!s.targets.custom && !s.targets.v55 && s.targets.protein === 170) s.targets.protein = 140;
        s.targets.v55 = true;
        s.sync = Object.assign({}, d.sync, s.sync || {});
        s.health = Object.assign({}, d.health, s.health || {});
        if (!Array.isArray(s.blocks)) s.blocks = [];
        if (!Array.isArray(s.bodyComp)) s.bodyComp = [];
        datePastWeights(s);
        return s;
      }
    }
  } catch (e) { console.warn('loadState failed:', e); }
  const fresh = migrateLegacy(defaultState());
  datePastWeights(fresh);
  return fresh;
}

  try {

/* ---------- streak ---------- */
function computeStreak() {
  // Count consecutive days back from today that have *any* activity
  // (food log or workout logged or weight). Keeps pressure low.
  let count = 0;
  let d = new Date();
  for (let i = 0; i < 365; i++) {
    const k = localDateKey(d);
    const e = S.log[k];
    const active = e && ((e.food && e.food.length) || e.workout || e.weight || (e.activities && e.activities.length) || (e.steps && e.steps >= S.targets.steps));
    if (!active) break;
    count++;
    d = addDays(d, -1);
  }
  return count;
}

const MILESTONES = [3, 7, 14, 30, 60, 84];
function nextMilestone(streak) {
  return MILESTONES.find(m => m > streak) || 84;
}
function relTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' hr ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + (days === 1 ? ' day ago' : ' days ago');
  const weeks = Math.floor(days / 7);
  return weeks + (weeks === 1 ? ' week ago' : ' weeks ago');
}

/* ---------- program math ---------- */
// Parse 'YYYY-MM-DD' as a LOCAL midnight Date so timezone never moves the day count.
function parseDateKey(str) {
  const parts = (str || '').split('-').map(Number);

  return new Date(parts[0], parts[1] - 1, parts[2]);

// Whole-day diff between two local Dates (rounded, ignoring DST drift).
function daysBetween(start, end) {

}

// This way, when you log data for previous days, the program counter shifts back.
function currentBlock() {
  return (S.blocks && S.blocks.length) ? S.blocks[S.blocks.length - 1] : null;
}
function blockLengthDays() {
  const b = currentBlock();
  return b ? b.lengthDays : PROGRAM_LENGTH_DAYS;
}
function blockWeeks() { return Math.round(blockLengthDays() / 7); }

  if (b) return b.start; // a new block starts its own clock; old logs stay as history
  let earliest = S.profile.programStart;
  for (const k of Object.keys(S.log)) {
    const e = S.log[k];
    if (!e) continue;
    const active = (e.food && e.food.length) || e.workout || e.weight || e.steps || e.notes;
    if (active && k < earliest) earliest = k;

}

  const start = parseDateKey(effectiveProgramStart());
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = daysBetween(start, today);
  return Math.max(1, diff + 1); // no cap
}

/* ═════════ workout model (shared by Today, Workout and the coach) ═════════ */
function blankSets(n, dk) {
  const k = exInfo(n).kind;
  const count = k === 'cardio' ? 1 : (k === 'time' ? (n === 'Mobility & Stretch' ? 1 : 3) : (isGuided(programKeyFor(dk)) ? [3, 3, 4, 4][Math.min(4, currentWeek()) - 1] : 3));
  return Array.from({ length: count }, () => ({ reps: '', weight: '', done: false }));
}
function workoutFor(dk) {
  const split = todaySplit(parseDateKey(dk));
  if (!split) return null;
  let entry = (S.log[dk] || {}).workout;
  if (entry && entry.day && entry.day !== split.name) entry = null;
  if (!entry) entry = { day: split.name, exercises: split.exercises.map(n => ({ n, sets: blankSets(n, dk) })), completed: false };
  if (split.exercises.some(n => !entry.exercises.find(e => e.n === n))) {
    const extras = entry.exercises.filter(e => !split.exercises.includes(e.n));
    entry = { ...entry, exercises: split.exercises.map(n => entry.exercises.find(e => e.n === n) || { n, sets: blankSets(n, dk) }).concat(extras) };
  }
  if (isGuided(programKeyFor(dk)) && split.kind === 'circuit') gymOrderEntry(entry);
  const W = { dk, split, entry, guided: isGuided(programKeyFor(dk)) };
  W.circuit = W.guided && split.kind === 'circuit';
  W.cardio = W.guided && split.kind === 'cardio';
  W.plan = circuitPlan(currentWeek());
  W.save = () => {
    dayEntry(dk).workout = entry;
    entry.completed = entry.exercises.every(ex => ex.sets.every(s => s.done));
    persist();
  };
  W.moves = entry.exercises.filter(ex => exInfo(ex.n).kind !== 'cardio' && !ex.added);
  W.finisher = entry.exercises.find(ex => exInfo(ex.n).kind === 'cardio' && !ex.added);
  W.roundsDone = W.moves.length ? Math.min(...W.moves.map(ex => ex.sets.filter(s => s.done).length)) : 0;
  W.finDone = W.finisher ? W.finisher.sets.some(s => s.done) : true;
  W.done = W.circuit ? (W.roundsDone >= W.plan.rounds && W.finDone) : !!entry.completed;
  W.setRound = r => {
    W.moves.forEach(ex => {
      while (ex.sets.length < W.plan.rounds) ex.sets.push({ reps: '', weight: '', done: false });
      ex.sets.forEach((s, i) => { s.done = i < r; });
    });
    W.save(); render();
  };
  W.setStationRound = (names, r) => {
    W.moves.filter(ex => names.includes(ex.n)).forEach(ex => {
      while (ex.sets.length < W.plan.rounds) ex.sets.push({ reps: '', weight: '', done: false });
      ex.sets.forEach((s, i) => { s.done = i < r; });
    });
    W.save(); render();
  };
  W.finish = mins => { if (W.finisher) { W.finisher.sets[0].done = true; W.finisher.sets[0].weight = W.finisher.sets[0].weight || String(mins); W.save(); render(); } };
  W.completeAll = mins => { entry.exercises.forEach(ex => ex.sets.forEach(s => { s.done = true; })); const z = entry.exercises.find(ex => exInfo(ex.n).kind === 'cardio'); if (z && !z.sets[0].weight) z.sets[0].weight = String(mins); W.save(); render(); };
  W.subtitle = W.circuit
    ? `${W.moves.length} moves · ${W.plan.rounds} rounds${W.finisher ? ' + finisher' : ''} · about ${split.mins} min`
    : W.cardio ? `About ${split.mins} min · cardio, then a stretch` : `${entry.exercises.length} exercises · about ${split.mins || 48} min`;
  return W;
}

async function restoreBackup(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.version !== 4 || !data.log) throw new Error('This isn’t a WZ Fitness backup');
    const days = Object.keys(data.log).length;
    askThen(`Replace everything in the app with this backup? It has ${days} days of logs.`, 'Replace with backup', () => {
      localStorage.setItem(STATE_KEY, JSON.stringify(data)); location.reload();
    }, true);
  } catch (err) { toast('Restore failed: ' + (err.message || err), 4000); }
}
