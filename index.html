        S.bodyComp.push({ date: m.date, weightKg: kg || null, bodyFatPct: bf, muscleKg: mus || null, source: m.source });
        if (kg >= 30 && kg <= 250 && m.date === localDateKey()) logWeight(kg);
        saveState(); UI.modal = null; toast('Scan saved'); render();
      } }, 'Save scan')
    );
  }
  return null;
}

function badgeGrid() {
  const allBadges = [
    { id: 'streak3', icon: '\u26a1', label: '3-day streak' },
    { id: 'streak7', icon: '\u{1F525}', label: '7-day streak' },
    { id: 'streak14', icon: '\u{1F3C6}', label: '14-day streak' },
    { id: 'streak30', icon: '\u{1F31F}', label: '30-day streak' },
    { id: 'streak50', icon: '\u{1F48E}', label: '50-day streak' },
    { id: 'streak84', icon: '\u{1F451}', label: 'Programme complete' },
  ];
  return el('div', { class: 'badge-grid' },
    ...allBadges.map(b => {
      const earned = S.badges.includes(b.id);
      return el('div', { class: 'badge ' + (earned ? 'earned' : 'locked') },
        el('div', { class: 'badge-icon' }, b.icon),
        el('div', { class: 'badge-label' }, b.label)
      );
    })
  );
}

function updateStreakBadges() {
  const streak = computeStreak();
  const checks = [
    { id: 'streak3',  min: 3 },
    { id: 'streak7',  min: 7 },
    { id: 'streak14', min: 14 },
    { id: 'streak30', min: 30 },
    { id: 'streak50', min: 50 },
    { id: 'streak84', min: 84 },
  ];
  let changed = false;
  checks.forEach(c => {
    if (streak >= c.min && !S.badges.includes(c.id)) {
      S.badges.push(c.id);
      changed = true;
    }
  });
  if (changed) saveState();
}

function tabIcon(key, active) {
  const map = {
    dashboard: 'home',
    training: 'dumbbell',
    nutrition: 'utensils',
    progress: 'chart',
  };
  const node = icon(map[key], 22, active ? 2 : 1.5);
  if (!node) return el('span', { style: 'display:inline-block; width:22px; height:22px;' });
  if (active) node.style.color = 'var(--blue)';
  return node;
}

function tabbar() {
  const tabs = [
    { key: 'dashboard', label: 'Dashboard' },
    { key: 'training',  label: 'Training' },
    { key: 'nutrition', label: 'Nutrition' },
    { key: 'progress',  label: 'Progress' },
  ];
  return el('nav', { class: 'tabbar' },
    ...tabs.map(t => {
      const active = UI.tab === t.key;
      return el('button', {
        class: 'tab-btn' + (active ? ' active' : ''),
        type: 'button',
        onClick: () => { if (t.key === 'dashboard') UI.selectedDate = localDateKey(); UI.tab = t.key; render(); window.scrollTo(0, 0); }
      },
        tabIcon(t.key, active),
        el('span', {}, t.label)
      );
    })
  );
}

function render() {
  const root = document.getElementById('root');
  if (!root) return;
  const views = {
    dashboard: dashboardView,
    training:  trainingView,
    nutrition: nutritionView,
    progress:  progressView,
  };
  const view = views[UI.tab] || dashboardView;
  const tabChanged = UI._lastTab !== UI.tab;
  if (tabChanged && UI.tab === 'dashboard') UI._ringsFromZero = true;
  UI._lastTab = UI.tab;
  const hadSheet = !!document.querySelector('body > .sheet-backdrop');
  root.innerHTML = '';
  root.appendChild(el('div', { class: 'app-shell' },
    view(),
    tabbar()
  ));
  // Remove any existing sheet from body before re-rendering so closing actually closes
  document.querySelectorAll('body > .sheet-backdrop').forEach(s => s.remove());
  const sheet = foodSheet();
  if (sheet) { document.body.appendChild(sheet); attachSheetPhysics(sheet, !hadSheet); }
  const modal = modalSheet();
  if (modal) { document.body.appendChild(modal); attachSheetPhysics(modal, !hadSheet); }
  if (tabChanged) { const pg = root.querySelector('.page'); if (pg) pg.classList.add('enter'); }
  if (UI._scroll != null) { window.scrollTo(0, UI._scroll); UI._scroll = null; }
}

window.addEventListener('scroll', () => { UI._lastScroll = window.scrollY; });
window.addEventListener('error', e => { console.error('Runtime error:', e.message, 'at', e.filename + ':' + e.lineno); });

function handleBuddyOnLoad() {
  // 1) New auto-sync style: ?buddyId=<id> -- auto-pair
  try {
    if (typeof location !== 'undefined' && location.search) {
      const params = new URLSearchParams(location.search);
      const id = params.get('buddyId');
      if (id) {
        if (!S.sync) S.sync = { myBlobId: null, theirBlobId: null, lastPushAt: 0, lastPullAt: 0, lastError: null };
        const clean = id.replace(/[^A-Za-z0-9]/g, '');
        if (clean.length >= 6) {
          S.sync.theirBlobId = clean;
          S.sync.lastPullAt = 0;
          saveState();
          toast('Pairing with buddy\u2026');
        }
        try {
          const cleanUrl = location.origin + location.pathname;
          history.replaceState({}, '', cleanUrl);
        } catch (e) {}
        return;
      }
    }
  } catch (e) { console.warn('buddyId handler failed:', e); }
  // 2) Legacy static snapshot: ?buddy=<base64>
  const incoming = parseBuddyFromUrl();
  if (incoming) {
    S.buddy = Object.assign({}, incoming, { savedAt: Date.now() });
    saveState();
    toast("Saved " + incoming.n + "'s progress");
    try {
      const clean = location.origin + location.pathname;
      history.replaceState({}, '', clean);
    } catch (e) {}
  }
}

function startSyncLoop() {
  // Periodic background sync: push my snapshot, pull buddy's. Cheap operation since
  // syncPush/syncPull self-rate-limit.
  setInterval(() => { syncAll({ silent: true }); }, 5 * 60 * 1000); // every 5 min
}

document.addEventListener('touchstart', () => {}, { passive: true });
let _booted = false;
function bootApp() {
  if (_booted) return; _booted = true;
  handleBuddyOnLoad();
  handleHealthParam();
  // v5.4: no remote health inbox polling (see importHealthFromClipboard)
  updateStreakBadges();
  render();
  startSyncLoop();
  // Seed sync after a short delay so first paint isn't blocked
  setTimeout(() => { syncAll({ silent: false }); }, 1500);
  // v6.5: offline only. No automatic calls to the site's online storage (Netlify credits ran out).
}

document.addEventListener('DOMContentLoaded', bootApp);
if (document.readyState !== 'loading') { bootApp(); }

// Re-sync when tab becomes visible again
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && COACH.on) {
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { COACH.wake = w; }).catch(() => {}); } catch (e) {}
    coachTick();
  }
  if (!document.hidden) {
    syncAll({ silent: false });
  }
});

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW fail:', e));
}


</script>
</body>
</html>
